<span
    class="red-social-icono red-social-icono--{{ red }}"
    aria-hidden="true"
>
    {% if red == "facebook" %}

        <svg viewBox="0 0 24 24" focusable="false">
            <path
                fill="currentColor"
                d="M13.6 22v-8h2.7l.4-3h-3.1V9.1c0-.9.3-1.5 1.6-1.5h1.7V4.9c-.8-.1-1.6-.2-2.4-.2-2.5 0-4.2 1.5-4.2 4.3V11H7.5v3h2.8v8h3.3Z"
            />
        </svg>

    {% elif red == "instagram" %}

        <svg viewBox="0 0 24 24" focusable="false">
            <rect
                x="3"
                y="3"
                width="18"
                height="18"
                rx="5"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
            />
            <circle
                cx="12"
                cy="12"
                r="4"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
            />
            <circle
                cx="17.4"
                cy="6.7"
                r="1.1"
                fill="currentColor"
            />
        </svg>

    {% elif red == "tiktok" %}

        <svg viewBox="0 0 24 24" focusable="false">
            <path
                fill="currentColor"
                d="M15.2 3c.3 2.1 1.6 3.5 3.8 4v3.1a8.4 8.4 0 0 1-3.8-1.2v6.2a5.8 5.8 0 1 1-5-5.7v3.2a2.7 2.7 0 1 0 1.8 2.5V3h3.2Z"
            />
        </svg>

    {% elif red == "youtube" %}

        <svg viewBox="0 0 24 24" focusable="false">
            <path
                fill="currentColor"
                d="M21.5 7.2a2.8 2.8 0 0 0-2-2C17.8 4.7 12 4.7 12 4.7s-5.8 0-7.5.5a2.8 2.8 0 0 0-2 2A29 29 0 0 0 2 12a29 29 0 0 0 .5 4.8 2.8 2.8 0 0 0 2 2c1.7.5 7.5.5 7.5.5s5.8 0 7.5-.5a2.8 2.8 0 0 0 2-2A29 29 0 0 0 22 12a29 29 0 0 0-.5-4.8Z"
            />
            <path
                fill="#ffffff"
                d="m10 15.3 5-3.3-5-3.3v6.6Z"
            />
        </svg>

    {% endif %}
</span>

<span class="red-social-texto">
    {{ etiqueta }}
</span>
